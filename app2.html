<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily News</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1c1e21;--muted:#6b7280;--accent:#d92d20;--border:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1c1e23;--text:#f1f2f4;--muted:#9ca3af;--border:#2b2e35}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}

/* ----- top bar ----- */
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px 8px}
.top-row{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.3rem}
.lang button{border:1px solid var(--border);background:transparent;color:var(--text);padding:5px 10px;font-size:.85rem;cursor:pointer}
.lang button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#search-form{display:flex;gap:8px;margin:10px 0}
#search-input{flex:1;min-width:0;padding:10px 12px;font-size:1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
#search-btn{padding:10px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer}
#topics{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
#topics button{flex:0 0 auto;padding:7px 14px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--text);font-size:.9rem;cursor:pointer;white-space:nowrap}
#topics button.active{background:var(--accent);border-color:var(--accent);color:#fff}
#topics button.main{font-weight:700;border-color:var(--accent)}

/* ----- page ----- */
main{max-width:760px;margin:0 auto;padding:14px}
#updated{color:var(--muted);font-size:.8rem;text-align:center;margin:0 0 10px}
#status,.empty{color:var(--muted);text-align:center;margin:20px 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.empty:empty{display:none}
.jump{display:flex;gap:8px;justify-content:center;margin:0 0 4px}
.jump button{padding:6px 14px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:.85rem;cursor:pointer}
.sec{display:flex;align-items:center;gap:8px;font-size:1.15rem;margin:22px 0 12px}
.sec::before{content:"";width:4px;height:1.1em;background:var(--accent);border-radius:2px}

/* ----- news cards (with photo) ----- */
.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;text-decoration:none;color:inherit}
.card:active{opacity:.7}
.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:10px;background:var(--border)}
.card h2{margin:0 0 8px;font-size:1.05rem;line-height:1.4}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--muted)}
.source{color:var(--accent);font-weight:600}
#more{display:block;margin:4px auto 6px;padding:10px 20px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:.95rem;cursor:pointer}

/* ----- videos ----- */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vcard.vid,.vcard.playing{grid-column:1 / -1}
@media (min-width:620px){.vgrid{grid-template-columns:1fr 1fr 1fr}.vcard.vid{grid-column:auto}.vcard.playing{grid-column:1 / -1}}
.vcard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.vbox{position:relative;aspect-ratio:16/9;background:#000}
.vplay{position:absolute;top:0;left:0;width:100%;height:100%;padding:0;border:0;background:#000;cursor:pointer}
.vplay img{width:100%;height:100%;object-fit:cover;display:block}
.vicon{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(0,0,0,.65)}
.vicon::after{content:"";position:absolute;left:22px;top:16px;border-style:solid;border-width:12px 0 12px 19px;border-color:transparent transparent transparent #fff}
.vbox iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.vinfo{padding:10px 12px 12px}
.vtitle{margin:0 0 8px;font-size:.95rem;line-height:1.4}
.vlink{color:var(--accent);font-size:.8rem;text-decoration:none}
.note{color:var(--muted);font-size:.85rem;margin:-4px 0 12px}
.note:empty{display:none}
.vplay.chan{background:linear-gradient(135deg,#374151,#000)}
.cname{position:absolute;left:0;right:0;bottom:10px;padding:0 8px;text-align:center;color:#fff;font-weight:600;font-size:.95rem;line-height:1.25}
.vcard.chan .vicon{width:40px;height:40px;margin:-34px 0 0 -20px}
.vcard.chan .vicon::after{left:16px;top:11px;border-width:9px 0 9px 14px}
.vcard.chan .vtitle{font-size:.8rem;margin-bottom:6px}
.vcard.chan .vinfo{padding:8px 10px 10px}
.vsearch{display:block;width:100%;padding:10px 12px;margin:0 0 10px;font-size:1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}
.ytsearch{display:none;margin:0 0 12px;color:var(--accent);font-size:.9rem;text-decoration:none}
#fresh{display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;padding:10px 18px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:.95rem;font-weight:600;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
</style>
</head>
<body>

<header id="top">
  <div class="top-row">
    <h1 id="title">My Daily News</h1>
    <div class="lang">
      <button id="lang-en" type="button">EN</button>
      <button id="lang-ar" type="button">عربي</button>
    </div>
  </div>
  <form id="search-form">
    <input id="search-input" type="search" placeholder="Search news..." autocomplete="off">
    <button type="submit" id="search-btn">Search</button>
  </form>
  <nav id="topics"></nav>
</header>

<main>
  <p id="updated"></p>
  <p id="status"></p>

  <div class="jump">
    <button id="go-news" type="button">News</button>
    <button id="go-videos" type="button">Videos</button>
  </div>

  <section id="news-section">
    <h2 class="sec" id="news-title">News</h2>
    <p class="empty" id="news-empty"></p>
    <div id="news"></div>
    <button id="more" type="button" style="display:none"></button>
  </section>

  <section id="video-section">
    <h2 class="sec" id="video-title">Videos</h2>
    <input class="vsearch" id="video-search" type="search" placeholder="Search videos or channels..." autocomplete="off">
    <a class="ytsearch" id="video-yt" target="_blank" rel="noopener"></a>
    <p class="note" id="video-note"></p>
    <p class="empty" id="video-empty"></p>
    <div class="vgrid" id="videos"></div>
  </section>
</main>

<button id="fresh" type="button"></button>

<script>
window.onerror = function (msg) {
  document.getElementById("status").textContent = "Error: " + msg;
};

// ---------- Topics ----------
var TOPICS = {

  india:    { en: "India",          ar: "الهند" },
  world:    { en: "World",          ar: "العالم" },
  war:      { en: "War & Conflict", ar: "حروب ونزاعات" },
  politics: { en: "Politics",       ar: "سياسة" },
  sports:   { en: "Sports",         ar: "رياضة" },
  business: { en: "Business",       ar: "اقتصاد" },
  tech:     { en: "Tech",           ar: "تقنية" },
  science:  { en: "Science",        ar: "علوم" },
  health:   { en: "Health",         ar: "صحة" },
  entertain:{ en: "Entertainment",  ar: "ترفيه" }
};

// Topics the Randomized button mixes together
var RANDOM_POOL = ["india", "war", "politics", "sports", "business", "tech", "science", "health", "entertain", "world"];

// News channels whose latest videos are shown when the robot has no video list
var CHANNELS = {
  en: {
    general: [["Al Jazeera English", "UCNye-wNBqNL5ZzHSJj3l8Bg"], ["BBC News", "UC16niRr50-MSBwiO3YDb3RA"],
              ["DW News", "UCknLrEdhRCp1aegoMqRaCZg"], ["Sky News", "UCoMdktPbSTixAyNGwb-UYkQ"],
              ["FRANCE 24 English", "UCQfwfsi5VrQ8yKZ-UWmAEFg"]],
    // 25 Indian news channels (English and Hindi), all-day news first
    india:   [["NDTV", "UCZFMm1mMw0F81Z37aaEzTUA"], ["India Today", "UCYPvAwZP8pZhSMW8qs7cVCw"],
              ["Aaj Tak (Hindi)", "UCt4t-jeY85JegMlZ-E5UWtA"], ["ABP News (Hindi)", "UCRWFSbif-RFENbBrSiez1DA"],
              ["Zee News (Hindi)", "UCIvaYmXn910QMdemBG3v1pQ"], ["India TV (Hindi)", "UCttspZesZIDEwwpVIgoZtWQ"],
              ["WION", "UC_gUM8rL-Lrg6O3adPW9K1g"], ["CNN-News18", "UCef1-8eOpJgud7szVPlZQAQ"],
              ["Times Now", "UC6RJ7-PaXg6TIH2BzZfTV7w"], ["Republic World", "UCwqusr8YDwM-3mEYTDeJHzw"],
              ["News18 India (Hindi)", "UCn1P85eKDEXS2iwbcasBm-g"], ["TV9 Bharatvarsh (Hindi)", "UCOutOIcn_oho8pyVN3Ng-Pg"],
              ["Republic Bharat (Hindi)", "UC7wXt18f2iA3EDXeqAVuKng"], ["News24 (Hindi)", "UCuzS3rPQAYqHcLWqOFuY0pw"],
              ["News Nation (Hindi)", "UCsNdeLwEZf86swPD3qJJ7Dw"], ["Mirror Now", "UCWCEYVwSqr7Epo6sSCfUgiw"],
              ["Firstpost", "UCz8QaiQxApLq8sLNcszYyJw"], ["Hindustan Times", "UCm7lHFkt2yB_WzL67aruVBQ"],
              ["The Indian Express", "UCJEDFSxHHOW1PpBccdSxOTA"], ["Times of India", "UCckHqySbfy5FcPP6MD_S-Yg"],
              ["ANI News", "UCtFQDgA8J8_iiwc5-KoAQlg"], ["India TV English", "UCd40cNBtOEqeWL2zz4HNSaQ"],
              ["Navbharat Times (Hindi)", "UCl8wUKzoUVzg7U6ky1ZR8hQ"], ["Live Hindustan (Hindi)", "UCCJRFl1Qjo83GG_09U-DIBA"],
              ["The Lallantop (Hindi)", "UCx8Z14PpntdaxCt2hakbQLQ"]],
    sports:  [["ESPN", "UCiWLfSweyRNmLpgEHekhoAg"], ["Sky Sports Football", "UCNAf1k0yIjyGu3k9BwAg3lg"]]
  },
  ar: {
    general: [["قناة الجزيرة", "UCfiwzLy-8yKzIbsmZTzxDgw"], ["العربية", "UCahpxixMCwoANAftn6IxkTg"]]
  }
};

var TEXT = {
  en: { title: "My Daily News", search: "Search news...", btn: "Search",
        loading: "Loading news...",
        news: "News", videos: "Videos", more: "Show more", youtube: "Open on YouTube",
        empty: "No news found. Try another topic or word.",
        noVideos: "No videos for this right now. Try another topic.",
        channelNote: "Latest videos from news channels. Tap a picture to play.",
        latestBefore: "", latestAfter: " - latest videos",
        notReady: "The news file is empty. Open your GitHub repository, tap Actions, choose \"Update news\" and tap Run workflow. Then come back in 1 minute.",
        error: "Could not read the news file. Check your internet and refresh the page.",
        updated: "Last updated: ", checked: "checked ",
        videoSearch: "Search videos or channels...",
        noMatch: "No video or channel matches that.",
        ytSearch: "Search YouTube for ",
        fresh: "New headlines - tap to update" },
  ar: { title: "أخباري اليومية", search: "ابحث في الأخبار...", btn: "بحث",
        loading: "جارٍ تحميل الأخبار...",
        news: "الأخبار", videos: "الفيديو", more: "عرض المزيد", youtube: "فتح في يوتيوب",
        empty: "لا توجد أخبار. جرّب موضوعًا أو كلمة أخرى.",
        noVideos: "لا توجد فيديوهات لهذا الموضوع الآن. جرّب موضوعًا آخر.",
        channelNote: "أحدث فيديوهات قنوات الأخبار. اضغط على الصورة للتشغيل.",
        latestBefore: "آخر فيديوهات ", latestAfter: "",
        notReady: "ملف الأخبار فارغ. افتح مستودع GitHub ثم Actions ثم Update news ثم Run workflow. ثم عد بعد دقيقة.",
        error: "تعذّر قراءة ملف الأخبار. تحقق من الإنترنت وحدّث الصفحة.",
        updated: "آخر تحديث: ", checked: "تم الفحص ",
        videoSearch: "ابحث في الفيديوهات أو القنوات...",
        noMatch: "لا يوجد فيديو أو قناة بهذا الاسم.",
        ytSearch: "ابحث في يوتيوب عن ",
        fresh: "أخبار جديدة - اضغط للتحديث" }
};

var PAGE = 10;               // how many headlines show before "Show more"
var lang = "en";
var currentTopic = "random";
var currentSearch = "";
var DATA = null;
var currentNews = [];
var shown = PAGE;
var videoFilter = "";        // what is typed in the Videos search box
var lastVideos = [], lastPicks = null, newsPicks = null;
var lastCheck = 0;           // when the page last asked for fresh news
var pendingData = null;      // fresh news waiting for the reader to tap
var REFRESH_MS = 5 * 60 * 1000;   // look for new news every 5 minutes
try { lang = localStorage.getItem("news-lang") || "en"; } catch (e) {}

function $(id) { return document.getElementById(id); }
var topicsBar = $("topics"), newsBox = $("news"), videosBox = $("videos"), statusBox = $("status");
var updatedBox = $("updated"), newsEmpty = $("news-empty"), videoEmpty = $("video-empty"), moreBtn = $("more");
var videoNote = $("video-note"), videoSearch = $("video-search"), videoYt = $("video-yt"), freshBtn = $("fresh");
var searchForm = $("search-form"), searchInput = $("search-input"), searchBtn = $("search-btn");
var titleEl = $("title"), btnEn = $("lang-en"), btnAr = $("lang-ar");

// ---------- Small helpers ----------
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Only allow normal web links (blocks javascript: and similar tricks)
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }

function shuffle(list) {
  for (var i = list.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
  }
  return list;
}

function formatDate(iso) {
  var d = new Date(iso);
  if (!iso || isNaN(d)) return "";
  return d.toLocaleString(lang === "ar" ? "ar" : "en",
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

// ---------- Choose what to show ----------
function pickNews(picks) {
  var pack = DATA[lang] || {};

  if (currentSearch) {
    var word = currentSearch.toLowerCase();
    var seen = {}, found = [];
    Object.keys(pack).forEach(function (topic) {
      pack[topic].forEach(function (a) {
        if (!seen[a.l] && a.t.toLowerCase().indexOf(word) !== -1) { seen[a.l] = true; found.push(a); }
      });
    });
    found.sort(function (a, b) { return a.d < b.d ? 1 : -1; });
    return found;
  }

  if (picks) {
    var mix = [];
    picks.forEach(function (k) { mix = mix.concat((pack[k] || []).slice(0, 8)); });
    return shuffle(mix);
  }
  return pack[currentTopic] || [];
}

function pickVideos(picks) {
  var pack = (DATA.videos && DATA.videos[lang]) || {};

  if (currentSearch) {
    var word = currentSearch.toLowerCase();
    var seen = {}, found = [];
    Object.keys(pack).forEach(function (topic) {
      pack[topic].forEach(function (v) {
        if (!seen[v.id] && v.t.toLowerCase().indexOf(word) !== -1) { seen[v.id] = true; found.push(v); }
      });
    });
    found.sort(function (a, b) { return a.d < b.d ? 1 : -1; });
    return found;
  }

  if (picks) {
    var mix = [], seen2 = {};
    picks.forEach(function (k) {
      (pack[k] || []).slice(0, 4).forEach(function (v) {
        if (!seen2[v.id]) { seen2[v.id] = true; mix.push(v); }
      });
    });
    return shuffle(mix);
  }
  return pack[currentTopic] || [];
}

// ---------- News cards (with photo) ----------
function makeNewsCard(item) {
  var href = safeUrl(item.l);
  var card = el("a", "card");
  if (!href) return card;
  card.href = href;
  card.target = "_blank";
  card.rel = "noopener";

  var photo = safeUrl(item.i);
  if (photo) {
    var img = document.createElement("img");
    img.className = "thumb";
    img.alt = "";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.addEventListener("error", function () { img.remove(); });   // photo failed: just hide it
    img.src = photo;
    card.appendChild(img);
  }

  card.appendChild(el("h2", "", item.t));
  var meta = el("div", "meta");
  meta.appendChild(el("span", "source", item.s || ""));
  meta.appendChild(el("span", "", formatDate(item.d)));
  card.appendChild(meta);
  return card;
}

function drawNews() {
  newsBox.innerHTML = "";
  newsEmpty.textContent = currentNews.length ? "" : TEXT[lang].empty;
  currentNews.slice(0, shown).forEach(function (item) { newsBox.appendChild(makeNewsCard(item)); });

  if (shown < currentNews.length) {
    moreBtn.style.display = "block";
    moreBtn.textContent = TEXT[lang].more + " (" + (currentNews.length - shown) + ")";
  } else {
    moreBtn.style.display = "none";
  }
}

moreBtn.addEventListener("click", function () { shown += PAGE; drawNews(); });

// ---------- Videos ----------
// Only one player at a time: put the other players back to their picture
function stopOthers() {
  [].forEach.call(videosBox.querySelectorAll(".vbox"), function (b) {
    if (b._play && b.querySelector("iframe")) {
      b.innerHTML = "";
      b.appendChild(b._play);
      b.parentNode.classList.remove("playing");
    }
  });
}

function makeVideoCard(v) {
  var card = el("div", "vcard vid");
  if (!/^[A-Za-z0-9_-]{11}$/.test(v.id || "")) return card;

  var box = el("div", "vbox");
  var play = el("button", "vplay");
  play.type = "button";
  play.setAttribute("aria-label", v.t);

  var img = document.createElement("img");
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  img.src = "https://i.ytimg.com/vi/" + v.id + "/mqdefault.jpg";
  play.appendChild(img);
  play.appendChild(el("span", "vicon"));

  // Tap the picture: the video plays right here
  play.addEventListener("click", function () {
    var frame = document.createElement("iframe");
    frame.src = "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&playsinline=1&rel=0";
    frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    frame.allowFullscreen = true;
    frame.title = v.t;
    stopOthers();
    box.innerHTML = "";
    box.appendChild(frame);
    card.classList.add("playing");
  });
  box._play = play;
  box.appendChild(play);
  card.appendChild(box);

  var info = el("div", "vinfo");
  info.appendChild(el("h3", "vtitle", v.t));
  var meta = el("div", "meta");
  meta.appendChild(el("span", "source", v.c || ""));
  meta.appendChild(el("span", "", formatDate(v.d)));
  info.appendChild(meta);

  var link = el("a", "vlink", TEXT[lang].youtube);
  link.href = "https://www.youtube.com/watch?v=" + v.id;
  link.target = "_blank";
  link.rel = "noopener";
  var linkRow = el("div");
  linkRow.style.marginTop = "8px";
  linkRow.appendChild(link);
  info.appendChild(linkRow);

  card.appendChild(info);
  return card;
}

// A card for a whole channel: tap and its latest videos play right here
function makeChannelCard(name, id) {
  var card = el("div", "vcard chan");
  if (!/^UC[A-Za-z0-9_-]{22}$/.test(id)) return card;

  var box = el("div", "vbox");
  var play = el("button", "vplay chan");
  play.type = "button";
  play.setAttribute("aria-label", name);
  play.appendChild(el("span", "vicon"));
  play.appendChild(el("span", "cname", name));
  play.addEventListener("click", function () {
    var frame = document.createElement("iframe");
    // "UU..." is the playlist of everything a channel uploaded, newest first
    frame.src = "https://www.youtube-nocookie.com/embed/videoseries?list=UU" + id.slice(2) +
                "&autoplay=1&playsinline=1&rel=0";
    frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    frame.allowFullscreen = true;
    frame.title = name;
    stopOthers();
    box.innerHTML = "";
    box.appendChild(frame);
    card.classList.add("playing");
  });
  box._play = play;
  box.appendChild(play);
  card.appendChild(box);

  var info = el("div", "vinfo");
  info.appendChild(el("h3", "vtitle", TEXT[lang].latestBefore + name + TEXT[lang].latestAfter));
  var link = el("a", "vlink", TEXT[lang].youtube);
  link.href = "https://www.youtube.com/channel/" + id + "/videos";
  link.target = "_blank";
  link.rel = "noopener";
  info.appendChild(link);
  card.appendChild(info);
  return card;
}

function fallbackChannels(picks) {
  var pack = CHANNELS[lang] || CHANNELS.en;
  if (picks) {                                  // Randomized: a mix of every group
    var mix = shuffle((pack.general || []).slice()).slice(0, 2)
      .concat(shuffle((pack.india || []).slice()).slice(0, 1), shuffle((pack.sports || []).slice()).slice(0, 1));
    return shuffle(mix);
  }
  if (currentTopic === "india" && pack.india) return pack.india.slice();
  if (currentTopic === "sports") return (pack.sports || []).concat(pack.general || []);
  return (pack.general || []).slice();
}

// every channel of this language, once each
function allChannels() {
  var pack = CHANNELS[lang] || CHANNELS.en, out = [], seen = {};
  Object.keys(pack).forEach(function (g) {
    pack[g].forEach(function (c) { if (!seen[c[1]]) { seen[c[1]] = true; out.push(c); } });
  });
  return out;
}

// every real video of this language, once each, newest first
function allVideos() {
  var pack = (DATA && DATA.videos && DATA.videos[lang]) || {}, seen = {}, out = [];
  Object.keys(pack).forEach(function (t) {
    pack[t].forEach(function (v) { if (!seen[v.id]) { seen[v.id] = true; out.push(v); } });
  });
  out.sort(function (a, b) { return a.d < b.d ? 1 : -1; });
  return out;
}

function drawVideos(list, picks) {
  lastVideos = list;
  lastPicks = picks;
  showVideos();
}

function showVideos() {
  videosBox.innerHTML = "";
  videoNote.textContent = "";
  videoEmpty.textContent = "";
  videoYt.style.display = "none";

  // something typed in the Videos search box: look through ALL videos and channels
  var word = videoFilter.toLowerCase();
  if (word) {
    var vids = allVideos().filter(function (v) { return ((v.t || "") + " " + (v.c || "")).toLowerCase().indexOf(word) !== -1; });
    var chans = allChannels().filter(function (c) { return c[0].toLowerCase().indexOf(word) !== -1; });
    vids.forEach(function (v) { videosBox.appendChild(makeVideoCard(v)); });
    chans.forEach(function (c) { videosBox.appendChild(makeChannelCard(c[0], c[1])); });
    if (!vids.length && !chans.length) videoEmpty.textContent = TEXT[lang].noMatch;
    videoYt.textContent = TEXT[lang].ytSearch + "\"" + videoFilter + "\"";
    videoYt.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(videoFilter);
    videoYt.style.display = "inline-block";
    return;
  }

  if (lastVideos.length) {                      // real video list from the robot
    lastVideos.forEach(function (v) { videosBox.appendChild(makeVideoCard(v)); });
    return;
  }
  if (currentSearch) { videoEmpty.textContent = TEXT[lang].noVideos; return; }

  // the robot has no videos: show the news channels' own players instead
  videoNote.textContent = TEXT[lang].channelNote;
  fallbackChannels(lastPicks).forEach(function (c) { videosBox.appendChild(makeChannelCard(c[0], c[1])); });
}

videoSearch.addEventListener("input", function () {
  videoFilter = videoSearch.value.trim();
  showVideos();
});

// ---------- Draw the whole page ----------
function render() {
  statusBox.textContent = "";
  newsBox.innerHTML = "";
  videosBox.innerHTML = "";
  newsEmpty.textContent = "";
  videoEmpty.textContent = "";
  videoNote.textContent = "";
  moreBtn.style.display = "none";

  if (!DATA) { statusBox.textContent = TEXT[lang].loading; return; }
  if (!DATA.updated) { statusBox.textContent = TEXT[lang].notReady; return; }

  setUpdatedLine();

  var picks = (currentTopic === "random" && !currentSearch)
    ? shuffle(RANDOM_POOL.slice()).slice(0, 3) : null;

  // keep only headlines that have a normal web link
  currentNews = pickNews(picks).filter(function (a) { return safeUrl(a.l); });
  shown = PAGE;
  newsPicks = picks;
  drawNews();
  drawVideos(pickVideos(picks), picks);
}

function setUpdatedLine() {
  if (!DATA || !DATA.updated) return;
  var line = TEXT[lang].updated + formatDate(DATA.updated);
  if (lastCheck) {
    line += " \u00b7 " + TEXT[lang].checked +
      new Date(lastCheck).toLocaleTimeString(lang === "ar" ? "ar" : "en", { hour: "2-digit", minute: "2-digit" });
  }
  updatedBox.textContent = line;
}

// ---------- Read news.json ----------
function loadData() {
  statusBox.textContent = TEXT[lang].loading;
  fetch("news.json?t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) { DATA = d; lastCheck = Date.now(); render(); })
    .catch(function () { statusBox.textContent = TEXT[lang].error; });
}

// ---------- Every 5 minutes: look for new news ----------
// Shows it at once when the reader is at the top. If the reader is further down,
// a small button appears instead, so the page never jumps while reading.
function applyNewData(d) {
  DATA = d;
  pendingData = null;
  freshBtn.style.display = "none";
  setUpdatedLine();
  currentNews = pickNews(newsPicks).filter(function (a) { return safeUrl(a.l); });
  drawNews();                                   // keeps how many headlines were open
  if (!videosBox.querySelector("iframe")) drawVideos(pickVideos(lastPicks), lastPicks);   // never stop a playing video
}

function checkForNews() {
  if (!DATA) { loadData(); return; }            // the first load failed: try again
  var done = false;
  var timer = setTimeout(function () { done = true; }, 10000);
  fetch("news.json?t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      clearTimeout(timer);
      if (done || !d || !d.updated) return;
      lastCheck = Date.now();
      if (!DATA.updated) { DATA = d; render(); return; }          // the news file was empty before
      if (d.updated === DATA.updated) { setUpdatedLine(); return; }   // nothing new
      if (window.pageYOffset < 200) { applyNewData(d); return; }
      pendingData = d;
      freshBtn.textContent = TEXT[lang].fresh;
      freshBtn.style.display = "block";
    })
    .catch(function () { clearTimeout(timer); });             // offline: just try again later
}

freshBtn.addEventListener("click", function () {
  if (pendingData) applyNewData(pendingData);
  window.scrollTo(0, 0);
});

setInterval(function () { if (!document.hidden) checkForNews(); }, REFRESH_MS);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && Date.now() - lastCheck > REFRESH_MS) checkForNews();
});

// ---------- Topic buttons ----------
function drawTopics() {
  topicsBar.innerHTML = "";
  Object.keys(TOPICS).forEach(function (key) {
    var b = el("button", "", TOPICS[key][lang]);
    b.type = "button";
    if (key === "random") b.classList.add("main");
    if (key === currentTopic && !currentSearch) b.classList.add("active");
    b.addEventListener("click", function () {
      currentTopic = key;
      currentSearch = "";
      searchInput.value = "";
      videoFilter = "";
      videoSearch.value = "";
      drawTopics();
      render();
      window.scrollTo(0, 0);
    });
    topicsBar.appendChild(b);
  });
}

// ---------- Jump buttons (News / Videos) ----------
function jumpTo(id) {
  var target = $(id);
  var y = target.getBoundingClientRect().top + window.pageYOffset - $("top").offsetHeight - 6;
  window.scrollTo({ top: y, behavior: "smooth" });
}
$("go-news").addEventListener("click", function () { jumpTo("news-section"); });
$("go-videos").addEventListener("click", function () { jumpTo("video-section"); });

// ---------- Language ----------
function applyLanguage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  titleEl.textContent = TEXT[lang].title;
  document.title = TEXT[lang].title;
  searchInput.placeholder = TEXT[lang].search;
  searchBtn.textContent = TEXT[lang].btn;
  videoSearch.placeholder = TEXT[lang].videoSearch;
  if (freshBtn.style.display === "block") freshBtn.textContent = TEXT[lang].fresh;
  $("news-title").textContent = TEXT[lang].news;
  $("video-title").textContent = TEXT[lang].videos;
  $("go-news").textContent = TEXT[lang].news;
  $("go-videos").textContent = TEXT[lang].videos + " ↓";
  btnEn.classList.toggle("active", lang === "en");
  btnAr.classList.toggle("active", lang === "ar");
  drawTopics();
}

function setLanguage(newLang) {
  lang = newLang;
  try { localStorage.setItem("news-lang", lang); } catch (e) {}
  applyLanguage();
  render();
}

btnEn.addEventListener("click", function () { setLanguage("en"); });
btnAr.addEventListener("click", function () { setLanguage("ar"); });

// ---------- Search ----------
searchForm.addEventListener("submit", function (event) {
  event.preventDefault();
  var word = searchInput.value.trim();
  if (!word) return;
  currentSearch = word;
  drawTopics();
  render();
});

// ---------- Start ----------
applyLanguage();
loadData();
</script>
</body>
</html>
